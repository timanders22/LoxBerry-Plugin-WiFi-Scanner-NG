<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- WiFi Scanner NG - Person in Funkwellen (das, was das Plugin misst).
       Hausform wie Bestand (gemessen 28.10.): Radialverlauf, zweiter Ring,
       Schatten am Motiv, Zierpunkte links/rechts, Trennlinie, Name + LOXBERRY. -->
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Hauptmotiv vergroessert (Faktor 1.24, Hausherr 28.10.) -->
    <g transform="translate(256 206) scale(1.24) translate(-256 -201.5)">
    <!-- Funkwellen ueber der Person -->
    <path d="M 221 179 A 50 50 0 0 1 291 179" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
    <path d="M 201 159 A 78 78 0 0 1 311 159" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.8" />
    <path d="M 181 139 A 106 106 0 0 1 331 139" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.5" />

    <!-- Person -->
    <circle cx="256" cy="214" r="26" fill="#ffffff" />
    <path d="M 194 300 C 194 262 222 246 256 246 C 290 246 318 262 318 300 Z" fill="#ffffff" />
    </g>
    <!-- Flanking Left Symbol: Smartphone (erkanntes Geraet) -->
    <g transform="translate(112, 168)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <rect x="-8" y="-13" width="16" height="26" rx="3" fill="#6dac20" />
      <rect x="-5" y="-9" width="10" height="15" rx="1" fill="#ffffff" />
      <circle cx="0" cy="9.5" r="1.6" fill="#ffffff" />
    </g>

    <!-- Flanking Right Symbol: Signalstaerke (Messwert) -->
    <g transform="translate(400, 168)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <rect x="-11" y="4" width="5" height="7" rx="1" fill="#6dac20" />
      <rect x="-3" y="-2" width="5" height="13" rx="1" fill="#6dac20" />
      <rect x="5" y="-9" width="5" height="20" rx="1" fill="#6dac20" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">WiFi Scanner</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>

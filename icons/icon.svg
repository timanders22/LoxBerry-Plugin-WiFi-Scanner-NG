<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WiFi Scanner NG">
  <!--
    Hausvorgabe fuer Plugin-Symbole:
      runde Scheibe randfuellend #6dac20, FLACH - keine Verlaeufe, keine Schatten
      zweiter Ring r=232, weiss, stroke-opacity 0.28, stroke-width 6
      Motiv in Weiss, innerhalb r etwa 200 (x,y = 60 bis 452)
      Strichstaerken nicht unter 14 Einheiten
      keine Schrift

    Bis 3.1.11 trug dieses Symbol einen Farbverlauf (fill="url(#bg-grad)"),
    eine gestrichelte Linie, Strichstaerken von 3 und 4 - und die beiden
    Schriftzuege "WiFi Scanner" und "LOXBERRY". LoxBerry zeigt das Symbol im
    Menue mit 64 Pixeln Kantenlaenge; bei dieser Groesse war von der Schrift
    ein grauer Balken uebrig und von den duennen Linien nichts.

    Motiv: eine Person in Funkwellen - das ist es, was das Plugin misst.
  -->
  <circle cx="256" cy="256" r="256" fill="#6dac20"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6"/>

  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round">
    <path d="M195 203 A 86 86 0 0 1 317 203"/>
    <path d="M161 169 A 134 134 0 0 1 351 169"/>
  </g>

  <circle cx="256" cy="264" r="42" fill="#ffffff"/>
  <path d="M176 396 c0-44 36-80 80-80 s80 36 80 80 z" fill="#ffffff"/>
</svg>

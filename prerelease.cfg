[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des Repositories und steuert das
# Auto-Update. Bei jedem Release VERSION und beide Adressen auf den neuen Tag
# setzen - die Adressen muessen auf einen Tag zeigen, den es wirklich gibt,
# sonst bekommen alle Installationen einen 404.

# Fassung des aktuellen Releases - muss mit der plugin.cfg uebereinstimmen.
VERSION=2.5

# Adresse des ZIP-Archivs
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-WifiScanner/archive/refs/tags/v2.5.zip

# Adresse mit weiteren Angaben zu dieser Fassung
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-WifiScanner/releases/tag/v2.5

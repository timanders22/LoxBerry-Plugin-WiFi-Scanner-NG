HINT_TAKT = "Short intervals detect faster but create more network traffic. 3 to 5 minutes is a good middle ground."
HINT_UEBERTRAGUNG = "MQTT topics are named and arrive retained — after a restart of the Miniserver the last state is there again immediately. Use UDP only if there is no MQTT gateway."

K_MERKWORT_NEU = "Create a new secret"
MERKWORT_WARNUNG = "The secret is part of every address above. <b>If a new one is created here, the endpoint rejects every address carrying the old one</b> — all virtual outputs in the Miniserver then have to be updated. The secret is also part of the backup file; that is precisely what makes moving to a second LoxBerry possible."

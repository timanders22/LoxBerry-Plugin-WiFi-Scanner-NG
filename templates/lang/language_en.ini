F_MODE = "-1 = no search (both ways off), 0 = both, 1 = Fritz!Box only, 2 = scan only"
F_OK = "1 if the last run really measured and is not older than three times the interval (9 minutes at 3 minutes). If it is 0, the presence values are stale – after a search failure they hold the last measured value."
F_PERSONEN = "Number of configured people"
F_ZAEHLER = "Wraps from 0 to 999. If the number stops changing, the schedule has stopped - and that shows even when the clock of the LoxBerry has jumped."

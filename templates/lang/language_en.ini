SP_NUTZLAST = "Payload"
SP_SUCHTEXT = "Command recognition"
SP_WIRKUNG = "Effect"
S1_BROKER = "Broker found"
S1_KEIN_BROKER = "config/system/general.json has no MQTT gateway – without a gateway only the UDP path remains."
S1_TEXT = "The %s must be set up on the LoxBerry."
S1_TITEL = "Step 1: prepare the MQTT gateway"
S2_TEXT = "One <b>virtual input</b> per row (Periphery → Virtual Inputs), name exactly as in the first column, do NOT tick “Use as digital input”. The LoxBerry user needs the rights to set virtual inputs on the Miniserver. Every new or renamed person results in a new name."
S2_TITEL = "Step 2: create virtual inputs (name table)"
S3_FUSS = "For commands nothing needs to be entered under gateway version 1 or 2. Anyone on the home network can send commands through the UDP input of the MQTT gateway – that is why the tick is off by default. The former topics wifi_ng/cmd/… no longer apply. The template contains all commands as a virtual output; insert each command only once."
S3_TEXT = "Commands are sent as <span class='sm-mono'>publish wifi_ng/befehl/&lt;name&gt; &lt;value&gt;</span> to the UDP input of the MQTT gateway (virtual output, never retain) and from there to the command bridge. They only work with the tick “Accept commands via MQTT” (MQTT tab), “search on/off” additionally only with “Accept intervening commands via MQTT”. The answer is in wifi_ng/befehl/&lt;name&gt;/quittung; the effect arrives via the inputs status_mode, _interval, _enabled and _zaehler."
S3_TITEL = "Step 3: commands from Loxone (MQTT, optional)"
S4_TEXT = "One formula IF(I1&gt;0;1;0) per person – then -1 (no statement) does not count as “present” – and feeding the formulas into an <i>OR</i> gives “somebody is at home”. Because Wi-Fi devices drop out briefly, an <b>off delay of 10 to 15 minutes</b> should follow before absence triggers anything. <b>And include <span class='sm-mono'>status_ok</span></b>: if it is 0, nobody is measuring any more."
S4_TITEL = "Sensible use in the project"
S5_TEXT = "With transmission set to UDP, the plugin sends lines of the form %s or %s to every Miniserver registered in the LoxBerry, on port %s. The Miniserver then needs one virtual UDP input per person with the command recognition %s. In addition <span class='sm-mono'>wifi_ok:</span> and <span class='sm-mono'>wifi_ts:</span> are sent, so that this path too shows whether anything is still being measured. New installations should use MQTT."
S5_TITEL = "UDP to the Miniserver"
S6_TEXT = "A virtual HTTP input can query the endpoint and a virtual output can drive it – every address with the secret. A polling interval of 60 to 300 seconds is enough."
S6_TITEL = "The plugin’s own endpoint"

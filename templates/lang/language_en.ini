[MQTTR]
ABO_GEMESSEN = "measured on this device: gateway V%d"
ABO_UNBEKANNT = "Which release of the MQTT gateway runs here could not be determined - hence both cases: <b>With gateway V1</b> the subscription <span class='sm-mono'>wifi_ng/#</span> has to be entered by hand under <i>Subscriptions</i>, otherwise nothing arrives at the Miniserver. <b>With gateway V2</b> there is nothing to enter - the gateway recognises the topic group by itself and you only tick the data points you want."
ABO_V1 = "In the MQTT gateway, add the entry <span class='sm-mono'>wifi_ng/#</span> under <i>Subscriptions</i>. <b>Without this entry nothing arrives at the Miniserver</b> - that is the most common reason for topics showing up in the finder while nothing gets through. The plugin already ships the entry in <span class='sm-mono'>config/mqtt_subscriptions.cfg</span>."
ABO_V2 = "There is nothing to enter by hand: the gateway detects the topic group by itself - here <span class='sm-mono'>wifi_ng</span>. Under <i>Subscriptions</i> you only tick the data points you need in the Miniserver."

HINT_BEFEHLE = "Loxone sends commands through the UDP input of the MQTT gateway to the shared command bridge (topics wifi_ng/befehl/…; table and template on the <i>Integration into Loxone</i> tab). Anyone on the home network can send commands through the UDP input of the MQTT gateway – that is why both ticks are off by default. “Search on/off” stops presence detection and therefore needs the second tick. The bridge also runs when the values go via UDP. The former topics wifi_ng/cmd/… no longer apply."
H_HAUS = "Quick check when Bluetooth reports leaving"
L_HAUS = "Quick check when the Bluetooth presence reports “leaving” (haus/anwesenheit, BLE-Scanner NG)"
HINT_HAUS = "Listens to <span class='sm-mono'>haus/anwesenheit/&lt;person&gt;</span> (provider BLE-Scanner NG, there “presence for other plugins”). When a person changes from 1 to 0, the plugin searches once at once – at most one run per 60 s and only while the regular search is on; a change within 120 s after an own 1→0 counts as feedback. If the source is silent (counter unchanged for 120 s), only the own interval applies – the <i>Test</i> tab says so. Off by default; writes nothing under haus/."

[LOX]
RETAIN_ERKLAERUNG = "The last column says whether the broker <b>retains</b> the value. For states it does — after a restart of the Miniserver the last state is there again at once. For the <b>heartbeat it does not</b>: a retained „running“ would stay even when the service is long dead, and would be exactly the false statement it was built against."
T_ZAEHLER = "Run counter of the scan"
ANWESENHEIT = "Presence of"
EINLEITUNG = "The sample project reads the values via the MQTT gateway into simple virtual inputs and sends commands via MQTT to the command bridge. A template with virtual HTTP inputs no longer exists. The HTTP endpoint is listed below for existing installations (tick “Accept HTTP endpoint for Loxone”); UDP to the Miniserver remains selectable on the MQTT tab."

E_INTERVAL = "Interval in minutes - allowed are 1, 3, 5, 10, 15, 30 and 60"
E_MODE = "Change the search path: 0 = both, 1 = Fritz!Box only, 2 = scan only"
E_SCAN = "Triggers a scan straight away"
E_SELFTEST = "Self-test - answers 200 with the correct secret, otherwise 403"
E_SUCHTEXT_HINWEIS = "The answer line has the form <span class='sm-mono'>WIFI;OK=1;ALTER=42;…</span>. One virtual input per field with this command recognition — <b>the semicolon belongs to it</b>, otherwise Loxone finds the search text at the wrong place first. <b>The field <span class='sm-mono'>OK</span> belongs on a watchdog</b>: if it is 0, nobody is measuring any more and the presence values are stale."
E_ZEILE = "The answer line for a virtual HTTP input – only reads, changes nothing (with the secret)"
F_ALTER = "Seconds since the last scan, -1 if none has run yet"
F_CRON = "1 if the schedule is actually in place"
F_DA = "How many of them are present right now"
F_ENABLED = "1 if scanning happens periodically"
F_INTERVAL = "Configured interval in minutes"

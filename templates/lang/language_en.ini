; WifiScanner - English texts
;
; Read by ws_t() in webfrontend/html/ws_lib.php.
; The keys must match language_de.ini exactly; English is the fallback for any
; language without its own file. Values in double quotes, %s are placeholders
; (sprintf) and must keep their number and order.
;
; TWO RULES that fail silently when broken:
;   Quote HTML attributes with SINGLE quotes - class='sm-mono', never
;   class="sm-mono". A straight double quote inside a value ends the value;
;   depending on the scanner mode it is truncated or the WHOLE file is
;   rejected, and nothing tells you.


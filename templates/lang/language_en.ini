B_V_STATUS2 = "V1 = output of %s, V2 = output of %s, V3 = output of %s"
ABSCHNITT_H = "Presence, failure and control"
SCHRITTE_TITEL = "How to take over this page"
SCHRITT1 = "In the plugin, tab <i>Settings</i>, add every person with their devices (MAC address or fixed IP from the Fritz!Box). On every phone switch off the <i>private Wi-Fi address</i> for the home network. Tick <i>Scan periodically</i> (off by default), interval 3 minutes, save. Tab <i>MQTT</i>: transfer <i>MQTT</i> (default since 3.2.15), tick <i>Accept commands via MQTT</i> and – for “Wi-Fi search on/off” – <i>Accept intervening commands via MQTT</i>, save."
SCHRITT2 = "Tab <i>Test</i> → <i>Start immediate scan</i>, shortly afterwards <i>Show status</i>: the person is present, the last run has measured. In the LoxBerry MQTT Gateway: version 1 add the subscription <span class='sm-mono'>wifi_ng/#</span>, version 2 tick the topics according to the name table (status/ok as Noncached)."
SCHRITT3 = "Create the virtual inputs according to the name table (step 2): one per person, plus wifi_ng_status_mode, _interval, _enabled, _ok and _zaehler. The button <i>Copy names</i> puts all names on the clipboard."
SCHRITT4 = "Create the four commands at the virtual output “LoxBerry MQTT-Gateway” (command on ON/OFF as in the table) – or generate <i>Template MQTT commands</i> (step 3) and import it in Loxone Config under Periphery → Virtual Outputs → Import template. Import only ONCE."
SCHRITT5 = "Create three virtual inputs as push buttons (Periphery → Virtual Inputs): %s, %s and %s, each with <i>Use in visualisation</i> on."
SCHRITT6 = "Create the page, drag the inputs, the four commands and the three push buttons onto it. One formula per person (%s) in front of the OR chain; with more than one person combine the formulas with OR (two inputs per OR; the table computes the chain for the persons added) – the last OR to %s."
SCHRITT7 = "Create the notification %s (Periphery → Messages → Notification), text as in the table, drag it onto the page. It gets exactly one connection (from %s)."
SCHRITT8 = "Place the remaining blocks with the block search (<b>F5</b>), parameters as in the table, connect from top to bottom. Analog value validation %s: connect En to wifi_ng_status_enabled and remove the tick at ‘En’ in the properties. Status %s: click “+” twice beforehand (V5, V6). Enter the rows of the status blocks (%s included) by hand in the order given, the one without condition last."
SCHRITT9 = "Save and transfer. Check: wifi_ng_status_zaehler counts up by one every 3 minutes; %s shows “measures via Fritz!Box and network search, every 3 minutes”; in the app %s – the counter moves on within a minute; %s – shortly afterwards “regular search is off”, then %s."
HINWEISE_TITEL = "Notes"
H_WEG = "<b>On %s:</b> connect what should happen when everybody is away (lower the heating, lights off). It only switches while the search really measures – a frozen state triggers nothing. <b>On %s:</b> for everything that should happen on arriving home. In your own project these two replace the placeholders of other plugin pages: “Niemand zu Hause (eigene Quelle)” → %s, “Anwesenheit (eigene Quelle)” → %s."
H_STEHT = "<b>On %s:</b> a virtual input keeps its last value when LoxBerry, schedule or MQTT gateway stall. The run counter changes with every search run; the analog value validation reports at output E when it stays the same for three times the interval. Whoever changes the interval in the plugin sets Tmc to three times that in seconds (5 minutes → 900 s) and adjusts the “9 minutes” in status %s."
H_EN = "<b>Analog value validation %s:</b> Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise wifi_ng_status_enabled arrives inverted and the failure message never triggers. With En at status_enabled it validates only while the regular search is on – “Wi-Fi search off” (holiday) thus reports no fault."
H_MELDUNG = "<b>On %s:</b> the message only comes after 5 minutes of fault (%s); a single faulty run or a restart of the LoxBerry does not report. A notification only sends on the change from off to on and gets exactly one source – the second path (%s) runs through the OR %s in front of it."
H_STATUS = "<b>On %s:</b> the status says in plain words what is missing and which button in the plugin helps. Status inputs from V5 on only appear after clicking “+” on the block. The plugin sends search method, interval and “regular search” with every search run and after every change (retained)."
H_STEUERUNG = "<b>On %s to %s:</b> the commands go via MQTT to the plugin’s command bridge (wifi_ng/befehl/…, never retain) and need no secret; the feedback arrives via the inputs wifi_ng_status_enabled and wifi_ng_status_interval. An output command may only be inserted once in Loxone. Without the tick “Accept commands via MQTT” the bridge acknowledges nothing."
H_SCHNELL = "<b>On %s:</b> sets the interval to 1 minute on “Alle weg (gemessen)” and back to 3 minutes afterwards – this overrides an interval changed later in the plugin. The bridge does not lock this command (lock 0 s): “Alle weg” may change several times a minute. If you do not want this, leave this row out."
H_REGEL = "<b>Rule:</b> OR and AND have two inputs each and exactly one source per input; with more persons the OR chain in front of %s gets longer, the numbers shift, the names stay. With one person numbers 8 and 15 stay free (formerly wifi_ng_status_listener and constant 1)."
H_GRENZE = "The sample project does not include changing the search method: the commands “WiFi-Scanner-NG: Suchweg …” are in the template MQTT commands (step 3). The answer line of the HTTP endpoint is left out – it is the path for existing installations without an MQTT gateway."
K_STEUERVORLAGE = "Generate control template (HTTP)"
S6_VORLAGE = "For immediate search, regular search on/off and the fast interval the button <i>Generate control template (HTTP)</i> creates a ready template for a virtual output to this endpoint – with address and secret. New installations use the template MQTT commands (step 3)."
B_FORMEL = "Formula"
B_N_FORMEL = "%s da (WLAN)"
B_P_FORMEL = "IF(I1>0;1;0) – only 1 counts as “present”, -1 (no statement) does not; one formula per further person"
B_V_I1 = "I1 = output of %s"
S2_FUSS = "<b>-1 = no statement</b>: if the search is disturbed, the plugin sends -1 for a person without a measurement (status_ok is 0 then) – the sample project therefore has a formula IF(I1&gt;0;1;0) in front of the off delay. After a person is removed, the gateway reads “-” as 0. Under gateway version 1 the subscription wifi_ng/# also delivers wifi_ng_status_befehle and the acknowledgements wifi_ng_befehl_…_quittung – harmless, no command has these names."
SP_GWNAME = "Name in the Miniserver (gateway)"
SP_V2 = "Version 2"
V2_HAKEN = "tick"
K_NAMEN_KOPIEREN = "Copy names"
KOPIERT = "copied"
T_BEFEHLE = "Sign of life of the command bridge (1 running, 0 off, -1 error)"
SP_TITEL = "Title (virtual output command)"
SP_HAKEN = "only works with"
SP_SPERRE = "Lock"
HAKEN_EINER = "“Accept commands via MQTT”"
HAKEN_BEIDE = "“Accept commands via MQTT” and “Accept intervening commands via MQTT”"
K_VORLAGE_MQTT = "Template MQTT commands"
SA_TITEL = "Failure detection"
SA_TEXT = "<span class='sm-mono'>wifi_ng_status_zaehler</span> counts up by one with every search run: an analog value validation with Tmc = three times the interval (540 s at 3 minutes), En connected to <span class='sm-mono'>wifi_ng_status_enabled</span>, reports a stalled LoxBerry, schedule or gateway. Tick <span class='sm-mono'>wifi_ng_status_ok</span> as Noncached under version 2. Do not use <span class='sm-mono'>status_ts</span> (local time)."
H_FORMEL = "<b>On %s:</b> wifi_ng_Beispiel carries -1 when the search could not measure this person (fault; status_ok is 0 then). The formula turns it into 0 – “no statement” does not count as “present”. The status %s shows -1 as a row of its own."
ALT_TITEL = "Existing installations: HTTP endpoint and UDP"
ALT_TEXT = "Since 3.2.15 the plugin’s own HTTP endpoint is behind a tick (off by default for new installations; on after an update if a secret already existed), and <b>the query now needs the secret as well</b> (?token=…) – the answer line carries the names and the presence. A Loxone input that fetches the line without the secret gets 403; the correct address is below. The action <i>listener</i> no longer exists (409 ENTFALLEN)."
L_ENDPUNKT = "Accept HTTP endpoint for Loxone (the query only with the secret, too)"
ALT_ERST_HAKEN = "The HTTP endpoint is off. Set the tick and save first – then the addresses and the control template (HTTP) appear here."

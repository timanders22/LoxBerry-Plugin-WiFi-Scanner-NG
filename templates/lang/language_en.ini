Z_ERKLAERUNG = "The state comes from the last scan, not from a query made when this page was opened. A dash means the run is too long ago to carry the display."
HINT_AKTIV = "Necessary without a Fritz!Box. May wake devices from sleep."
HINT_CACHE = "Saves search runs. Better off when IP addresses change often."
HINT_FRITZ = "Fast and completely silent: the router knows who is logged in anyway."
HINT_FRITZ_ANMELDUNG = "Empty by default, and then the plugin behaves as before: it queries the box without logging in. Measured on a FRITZ!Box 7690 with FRITZ!OS 8.25, that is enough - the box answers the host query without a login. Other boxes or settings may close that access; recognisable by <span class='sm-mono'>401 Unauthorized</span> in the log. In that case enter a user name and the matching password of the box here, and in the box itself access for applications must be allowed under <i>Home Network → Network → Network Settings</i>. Quotation marks are not possible in user name and password."
HINT_LOESCHEN = "To remove a person, tick the box in the last column and save. Clearing the name is not enough - that would be a change indistinguishable from a typo."
HINT_MODUS0 = "Both together are mode 0: ask the router first, and only ping whoever is missing there. That is the gentlest order."
HINT_PERIODISCH = "With this off, the plugin only scans on command — from Loxone via MQTT or by hand on the Test tab."
HINT_PERSONEN = "One line per person. The right-hand field takes the <b>MAC addresses</b> (form %s), <b>fixed IP addresses</b> or <b>host names</b> of that person's devices, separated by semicolon, comma or space. As soon as one of the devices answers, the person counts as present. A MAC address with hyphens is rejected. The name becomes the MQTT topic — umlauts are replaced (ä → ae), spaces and other characters become _; two names with the same topic are rejected, and so are quotation marks in the name. Anything that is not a valid address is rejected and reported to you; nothing is saved then."
HINT_TAKT = "Short intervals detect faster but create more network traffic. 3 to 5 minutes is a good middle ground."
HINT_UEBERTRAGUNG = "MQTT topics are named and arrive retained — after a restart of the Miniserver the last state is there again immediately. A new installation uses MQTT by default (since 3.2.15). Use UDP only if there is no MQTT gateway; when switching to UDP the plugin clears the retained topics under wifi_ng/."

ABSCHNITT_H = "Anwesenheit, Ausfall und Steuerung"
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
SCHRITT1 = "Im Plugin Reiter <i>Einstellungen</i> jede Person mit ihren Geräten anlegen (MAC-Adresse oder feste IP aus der Fritz!Box). Auf jedem Telefon für das Heimnetz die <i>private WLAN-Adresse</i> abschalten. <i>Periodisch scannen</i> anhaken (ab Werk aus), Takt 3 Minuten, speichern. Reiter <i>MQTT</i>: Übertragung <i>MQTT</i> (ab Werk seit 3.2.15), <i>Befehle über MQTT annehmen</i> und – für „WLAN-Suche ein/aus“ – <i>Eingreifende Befehle über MQTT annehmen</i> anhaken, speichern."
SCHRITT2 = "Reiter <i>Test</i> → <i>Sofort-Scan starten</i>, kurz danach <i>Status anzeigen</i>: die Person steht auf anwesend, der letzte Lauf hat gemessen. Im LoxBerry unter MQTT Gateway: Fassung 1 das Abo <span class='sm-mono'>wifi_ng/#</span> eintragen, Fassung 2 die Themen nach der Namenstabelle anhaken (status/ok als Noncached)."
SCHRITT3 = "Die Virtuellen Eingänge nach der Namenstabelle (Schritt 2) anlegen: je Person einer, dazu wifi_ng_status_mode, _interval, _enabled, _ok und _zaehler. Der Knopf <i>Namen kopieren</i> legt alle Namen in die Zwischenablage."
SCHRITT4 = "Die vier Befehle an den Virtuellen Ausgang „LoxBerry MQTT-Gateway“ anlegen (Befehl bei EIN/AUS wie in der Tabelle) – oder <i>Vorlage MQTT-Befehle</i> (Schritt 3) erzeugen und in Loxone Config unter Peripherie → Virtuelle Ausgänge → Vorlage importieren. Nur EINMAL einlesen."
SCHRITT5 = "Drei Virtuelle Eingänge als Taste anlegen (Peripherie → Virtuelle Eingänge): %s, %s und %s, je <i>In Visualisierung verwenden</i> an."
SCHRITT6 = "Seite anlegen, die Eingänge, die vier Befehle und die drei Tasten daraufziehen. Je Person eine Formel (%s) vor die ODER-Kette; bei mehr als einer Person die Formeln über ODER zusammenführen (je ODER zwei Eingänge; die Tabelle rechnet die Kette für die angelegten Personen) – das letzte ODER an %s."
SCHRITT7 = "Benachrichtigung %s anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Tabelle, auf die Seite ziehen. Sie bekommt genau eine Leitung (von %s)."
SCHRITT8 = "Übrige Bausteine über die Baustein-Suche (<b>F5</b>) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden. Analogwertvalidierung %s: En an wifi_ng_status_enabled legen und den Haken bei ‚En‘ im Eigenschaftsfenster entfernen. Status %s: vorher zweimal „+“ klicken (V5, V6). Zeilen der Status-Bausteine (%s eingeschlossen) in der angegebenen Reihenfolge von Hand eintragen, die ohne Bedingung zuletzt."
SCHRITT9 = "Speichern und übertragen. Probe: wifi_ng_status_zaehler zählt alle 3 Minuten eins weiter; %s zeigt „misst über Fritz!Box und Netzwerk-Suche, alle 3 Minuten“; in der App %s – der Zähler springt binnen einer Minute weiter; %s – nach kurzer Zeit „regelmäßige Suche ist aus“, danach %s."
HINWEISE_TITEL = "Hinweise"
H_WEG = "<b>Zu %s:</b> Hierauf legen, was bei Abwesenheit geschehen soll (Heizung absenken, Licht aus). Er schaltet nur, wenn die Suche wirklich misst – ein festgefrorener Stand löst nichts aus. <b>Zu %s:</b> für alles, was beim Heimkommen geschehen soll. Im eigenen Projekt ersetzen diese beiden die Platzhalter anderer Plugin-Seiten: „Niemand zu Hause (eigene Quelle)“ → %s, „Anwesenheit (eigene Quelle)“ → %s."
H_STEHT = "<b>Zu %s:</b> Ein Virtueller Eingang behält seinen letzten Wert, wenn LoxBerry, Zeitplan oder MQTT-Gateway stehen. Der Laufzähler ändert sich bei jedem Suchlauf; die Analogwertvalidierung meldet am Ausgang E, wenn er dreimal den Takt lang steht. Wer den Takt im Plugin ändert, setzt Tmc auf das Dreifache in Sekunden (5 Minuten → 900 s) und passt die „9 Minuten“ im Status %s an."
H_EN = "<b>Analogwertvalidierung %s:</b> Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt wifi_ng_status_enabled umgekehrt an und die Ausfallmeldung löst nie aus. Mit En an status_enabled prüft sie nur bei eingeschalteter regelmäßiger Suche – „WLAN-Suche ausschalten“ (Urlaub) meldet so keine Störung."
H_MELDUNG = "<b>Zu %s:</b> Die Meldung kommt erst nach 5 Minuten Störung (%s); ein einzelner gestörter Lauf oder ein Neustart des LoxBerry meldet nicht. Eine Benachrichtigung sendet nur beim Wechsel von Aus auf Ein und bekommt genau eine Quelle – der zweite Weg (%s) läuft über das ODER %s davor."
H_STATUS = "<b>Zu %s:</b> Der Status sagt in Klartext, was fehlt und welcher Knopf im Plugin hilft. Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein. Suchweg, Takt und „regelmäßige Suche“ sendet das Plugin bei jedem Suchlauf und nach jeder Änderung (retained)."
H_STEUERUNG = "<b>Zu %s bis %s:</b> Die Befehle gehen über MQTT an die Befehlsbrücke des Plugins (wifi_ng/befehl/…, nie retain) und brauchen kein Merkwort; die Rückmeldung kommt über die Eingänge wifi_ng_status_enabled und wifi_ng_status_interval. Ein Ausgangsbefehl darf in Loxone nur einmal eingefügt werden. Ohne den Haken „Befehle über MQTT annehmen“ quittiert die Brücke nichts."
H_SCHNELL = "<b>Zu %s:</b> stellt den Takt bei „Alle weg (gemessen)“ auf 1 Minute und danach auf 3 Minuten zurück – einen später im Plugin geänderten Takt überschreibt das. Die Brücke sperrt diesen Befehl nicht (Sperre 0 s): „Alle weg“ darf mehrmals in der Minute wechseln. Wer das nicht will, lässt diese Zeile weg."
H_REGEL = "<b>Regel:</b> ODER und UND haben je zwei Eingänge und je Eingang genau eine Quelle; bei mehr Personen verlängert sich die ODER-Kette vor %s, die Nummern verschieben sich, die Namen bleiben. Die Nummern 8 und 15 bleiben bei einer Person frei (früher wifi_ng_status_listener und Konstante 1)."
H_GRENZE = "Den Suchweg umstellen nimmt das Musterprojekt nicht auf: die Befehle „WiFi-Scanner-NG: Suchweg …“ stehen in der Vorlage MQTT-Befehle (Schritt 3). Die Antwortzeile des HTTP-Endpunkts bleibt außen vor – sie ist der Weg für bestehende Anlagen ohne MQTT-Gateway."
K_STEUERVORLAGE = "Steuervorlage (HTTP) erzeugen"
S6_VORLAGE = "Für Sofort-Suche, regelmäßige Suche ein/aus und den schnellen Takt erzeugt der Knopf <i>Steuervorlage (HTTP) erzeugen</i> eine fertige Vorlage für einen Virtuellen Ausgang an diesen Endpunkt – mit Adresse und Merkwort. Neue Anlagen nehmen die Vorlage MQTT-Befehle (Schritt 3)."
B_FORMEL = "Formel"
B_N_FORMEL = "%s da (WLAN)"
B_P_FORMEL = "IF(I1>0;1;0) – nur 1 zählt als „da“, -1 (keine Aussage) nicht; je weitere Person eine eigene Formel"
B_V_I1 = "I1 = Ausgang von %s"
S2_FUSS = "<b>-1 = keine Aussage</b>: steht die Suche gestört, sendet das Plugin für eine Person ohne Messung -1 (status_ok steht dann auf 0) – im Musterprojekt steht deshalb eine Formel IF(I1&gt;0;1;0) vor der Ausschaltverzögerung. Nach dem Austragen einer Person liest das Gateway „-“ als 0. Unter Gateway-Fassung 1 kommen mit dem Abo wifi_ng/# auch wifi_ng_status_befehle und die Quittungen wifi_ng_befehl_…_quittung an – harmlos, kein Befehl heißt so."
SP_GWNAME = "Name im Miniserver (Gateway)"

; WifiScanner - deutsche Texte
;
; Gelesen von ws_t() in webfrontend/html/ws_lib.php.
; Die Schluessel muessen mit language_en.ini deckungsgleich sein; Englisch ist
; die Rueckfallebene. Werte in doppelten Anfuehrungszeichen, %s sind
; Platzhalter (sprintf) und muessen in Zahl und Reihenfolge erhalten bleiben.
;
; ZWEI FORMREGELN, die hier stumm scheitern, wenn man sie bricht:
;   HTML-Attribute EINFACH quotieren - class='sm-mono', nie class="sm-mono".
;   Ein gerades Anfuehrungszeichen im Wert beendet den Wert; je nach Lesemodus
;   wird er abgeschnitten oder die GANZE Datei abgewiesen, und man sieht es
;   nicht. Anfuehrungen im Text deshalb typografisch: „so“.


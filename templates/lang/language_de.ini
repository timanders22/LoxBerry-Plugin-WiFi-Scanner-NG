HAKEN_BEIDE = "„Befehle über MQTT annehmen“ und „Eingreifende Befehle über MQTT annehmen“"
K_VORLAGE_MQTT = "Vorlage MQTT-Befehle"
SA_TITEL = "Ausfallerkennung"
SA_TEXT = "<span class='sm-mono'>wifi_ng_status_zaehler</span> zählt bei jedem Suchlauf eins weiter: eine Analogwertvalidierung mit Tmc = dreimal der Takt (bei 3 Minuten 540 s), En an <span class='sm-mono'>wifi_ng_status_enabled</span>, meldet einen stehenden LoxBerry, Zeitplan oder Gateway. <span class='sm-mono'>wifi_ng_status_ok</span> unter Fassung 2 als Noncached anhaken. <span class='sm-mono'>status_ts</span> nicht verwenden (Ortszeit)."
H_FORMEL = "<b>Zu %s:</b> wifi_ng_Beispiel trägt -1, wenn die Suche diese Person nicht messen konnte (Störung; status_ok steht dann auf 0). Die Formel macht daraus 0 – „keine Aussage“ zählt nicht als „da“. Der Status %s zeigt -1 als eigene Zeile."
ALT_TITEL = "Bestehende Anlagen: HTTP-Endpunkt und UDP"
ALT_TEXT = "Seit 3.2.15 steht der eigene HTTP-Endpunkt hinter einem Haken (neu ab Werk aus; beim Update an, wenn schon ein Merkwort da war), und <b>auch die Abfrage braucht jetzt das Merkwort</b> (?token=…) – die Antwortzeile trägt die Namen und die Anwesenheit. Ein Loxone-Eingang, der die Zeile ohne Merkwort holt, bekommt 403; die richtige Adresse steht unten. Die Aktion <i>listener</i> gibt es nicht mehr (409 ENTFALLEN)."

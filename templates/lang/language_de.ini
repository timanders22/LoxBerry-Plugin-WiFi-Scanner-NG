S5_TEXT = "Steht die Übertragung auf UDP, sendet das Plugin an alle im LoxBerry eingetragenen Miniserver Zeilen der Form %s bzw. %s an Port %s. Im Miniserver braucht es dafür einen virtuellen UDP-Eingang je Person mit der Befehlserkennung %s. Zusätzlich gehen <span class='sm-mono'>wifi_ok:</span> und <span class='sm-mono'>wifi_ts:</span> hinaus, damit auch auf diesem Weg erkennbar bleibt, ob überhaupt noch gemessen wird. Neue Anlagen sollten MQTT verwenden."

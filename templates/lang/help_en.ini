; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Wifi Scanner"
K02 = "Detects who is at home from <b>MAC and IP addresses</b> and reports <b>0</b> (absent) or <b>1</b> (present) per person to the Miniserver."
K03 = "The two search methods"
K04 = "<b>Both together</b> is the gentlest setting: ask the router first, and only ping those who are missing there."
K05 = "Common pitfalls"
K06 = "<b>Phones disappear briefly.</b> Wi-Fi devices switch off their radio while asleep. In Loxone you should therefore put an <b>off delay of 10 to 15 minutes</b> behind the result before absence triggers anything – otherwise the heating switches off because a phone took a short nap."
K07 = "<b>Random MAC addresses.</b> Current phones use a separate, random MAC per network. On the device, the <i>private Wi-Fi address</i> has to be switched off for the home network, otherwise the address changes and detection comes to nothing. Alternatively, enter the fixed IP address from the Fritz!Box."
K08 = "<b>Commands via the command bridge.</b> Since 3.2.15 the shared command bridge accepts commands from Loxone via MQTT – only with the tick “Accept commands via MQTT” on the MQTT tab (off by default) and the package mosquitto-clients. The plugin’s own MQTT listener no longer exists."
K09 = "Control from Loxone"
K10 = "Via a virtual output to the UDP input of the MQTT gateway, sent <b>not retained</b>:"
K11 = "Everything else is on the <i>Integration into Loxone</i> tab (name table, commands, template MQTT commands); the <i>Test</i> tab contains a diagnosis that checks schedule, command bridge, broker and the required tools one by one."
K12 = "Method"
K13 = "When it makes sense"
K14 = "<b>Ask the Fritz!Box</b> (TR-064)"
K15 = "Fast and silent – the router knows who is logged on anyway. Requires a Fritz!Box with TR-064 switched on."
K16 = "<b>Search actively</b> (arping/ping)"
K17 = "Necessary without a Fritz!Box. May wake devices from sleep."
K18 = "Topic"
K19 = "Effect"
K20 = "<span class='sm-mono'>wifi_ng/befehl/scan jetzt</span>"
K21 = "Immediate search (also beides, fritzbox, ping)"
K22 = "<span class='sm-mono'>wifi_ng/befehl/modus beides|fritzbox|ping</span>"
K23 = "Change the search method"
K24 = "<span class='sm-mono'>wifi_ng/befehl/takt 1|3|5|10|15|30|60</span>"
K25 = "Polling interval in minutes"
K26 = "<span class='sm-mono'>wifi_ng/befehl/suche 0|1</span>"
K27 = "regular search off/on – only with the second tick “Accept intervening commands via MQTT”"
K28 = "Existing installations: the plugin’s own endpoint"
K29 = "The plugin has its own address that a virtual HTTP input can query and a virtual output can drive. Since 3.2.15 it is behind the tick “Accept HTTP endpoint for Loxone” (tab <i>Integration into Loxone</i>, existing installations; off by default for new installations, on after an update if a secret existed), and <b>the query needs the secret as well</b> (?token=…). The ready addresses are shown there. The action <i>listener</i> no longer exists since 3.2.15. Include the field <span class='sm-mono'>OK</span> in a monitoring – if it is 0, nobody is measuring any more."
K30 = "Backing up the settings"
K31 = "The <i>Settings</i> tab holds two buttons: <b>Back up settings</b> downloads a file, <b>Restore</b> takes it back. This is meant for moving to a second LoxBerry. The file contains the secret of this installation and, if entered, the password of the Fritz!Box - treat it like a password. A file with even a single wrong value is rejected as a whole and changes nothing."

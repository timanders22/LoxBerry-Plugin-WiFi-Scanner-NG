; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Wifi Scanner"
K02 = "Erkennt anhand von <b>MAC- und IP-Adressen</b>, wer zu Hause ist, und meldet je Person <b>0</b> (abwesend) oder <b>1</b> (anwesend) an den Miniserver."
K03 = "Die zwei Suchwege"
K04 = "<b>Beide zusammen</b> sind die schonendste Einstellung: erst den Router fragen, und nur wer dort fehlt, wird angepingt."
K05 = "Häufige Stolperstellen"
K06 = "<b>Handys verschwinden kurz.</b> WLAN-Geräte schalten den Funk im Ruhezustand ab. In Loxone gehört deshalb hinter das Ergebnis eine <b>Ausschaltverzögerung von 10 bis 15 Minuten</b>, bevor die Abwesenheit etwas auslöst – sonst schaltet die Heizung ab, weil ein Telefon kurz geschlafen hat."
K07 = "<b>Zufällige MAC-Adressen.</b> Aktuelle Telefone verwenden je WLAN eine eigene, zufällige MAC. Im Gerät muss für das Heimnetz die <i>private WLAN-Adresse</i> abgeschaltet sein, sonst ändert sich die Adresse und die Erkennung geht ins Leere. Alternativ die feste IP-Adresse aus der Fritz!Box eintragen."
K08 = "<b>Befehle über die Befehlsbrücke.</b> Seit 3.2.15 nimmt die gemeinsame Befehlsbrücke Befehle aus Loxone über MQTT an – nur mit dem Haken „Befehle über MQTT annehmen“ im Reiter MQTT (ab Werk aus) und dem Paket mosquitto-clients. Den eigenen MQTT-Listener gibt es nicht mehr."
K09 = "Steuerung aus Loxone"
K10 = "Über einen Virtuellen Ausgang an den UDP-Eingang des MQTT-Gateways, <b>nicht retained</b> gesendet:"
K11 = "Alles Weitere steht im Reiter <i>Einbindung in Loxone</i> (Namenstabelle, Befehle, Vorlage MQTT-Befehle); der Reiter <i>Test</i> enthält eine Diagnose, die Zeitplan, Befehlsbrücke, Broker und die benötigten Werkzeuge einzeln prüft. Seit 3.2.16 zählt der Reiter Test unter MQTT-Gateway V2 nach, ob alle Datenpunkte der Hakenliste angehakt sind und „Noncached“ stimmt."
K12 = "Weg"
K13 = "Wann sinnvoll"
K14 = "<b>Fritz!Box fragen</b> (TR-064)"
K15 = "Schnell und lautlos – der Router weiß ohnehin, wer angemeldet ist. Setzt eine Fritz!Box mit eingeschaltetem TR-064 voraus."
K16 = "<b>Aktiv suchen</b> (arping/ping)"
K17 = "Notwendig ohne Fritz!Box. Weckt Geräte unter Umständen aus dem Ruhezustand."
K18 = "Thema"
K19 = "Wirkung"
K20 = "<span class='sm-mono'>wifi_ng/befehl/scan jetzt</span>"
K21 = "Sofort-Suche (auch beides, fritzbox, ping)"
K22 = "<span class='sm-mono'>wifi_ng/befehl/modus beides|fritzbox|ping</span>"
K23 = "Suchweg umstellen"
K24 = "<span class='sm-mono'>wifi_ng/befehl/takt 1|3|5|10|15|30|60</span>"
K25 = "Abfragetakt in Minuten"
K26 = "<span class='sm-mono'>wifi_ng/befehl/suche 0|1</span>"
K27 = "regelmäßige Suche aus/ein – nur mit dem zweiten Haken „Eingreifende Befehle über MQTT annehmen“"
K28 = "Bestehende Anlagen: der eigene Endpunkt"
K29 = "Das Plugin hat eine eigene Adresse, die ein virtueller HTTP-Eingang abfragen und ein virtueller Ausgang ansteuern kann. Seit 3.2.15 steht sie hinter dem Haken „HTTP-Endpunkt für Loxone annehmen“ (Reiter <i>Einbindung in Loxone</i>, Bestehende Anlagen; neu ab Werk aus, beim Update an, wenn ein Merkwort da war), und <b>auch die Abfrage braucht das Merkwort</b> (?token=…). Die fertigen Adressen stehen dort zum Abschreiben. Die Aktion <i>listener</i> gibt es seit 3.2.15 nicht mehr. Legen Sie das Feld <span class='sm-mono'>OK</span> mit auf eine Überwachung – steht es auf 0, misst niemand mehr."
K30 = "Einstellungen sichern"
K31 = "Im Reiter <i>Einstellungen</i> liegen zwei Knöpfe: <b>Einstellungen sichern</b> lädt eine Datei herunter, <b>Zurückspielen</b> nimmt sie wieder entgegen. Gedacht ist das für den Umzug auf einen zweiten LoxBerry. Die Datei enthält das Merkwort dieser Anlage und, wenn eingetragen, das Kennwort der Fritz!Box - behandeln Sie sie wie ein Passwort. Eine Datei, an der auch nur ein Wert nicht stimmt, wird ganz abgelehnt und ändert nichts."

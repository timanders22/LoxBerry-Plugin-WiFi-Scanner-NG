; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Wifi Scanner"
K02 = "Erkennt anhand von <b>MAC- und IP-Adressen</b>, wer zu Hause ist, und meldet je Person <b>0</b> (abwesend) oder <b>1</b> (anwesend) an den Miniserver."
K03 = "Die zwei Suchwege"
K04 = "<b>Beide zusammen</b> sind die schonendste Einstellung: erst den Router fragen, und nur wer dort fehlt, wird angepingt."
K05 = "Häufige Stolperstellen"
K06 = "<b>Handys verschwinden kurz.</b> WLAN-Geräte schalten den Funk im Ruhezustand ab. In Loxone gehört deshalb hinter das Ergebnis eine <b>Ausschaltverzögerung von 10 bis 15 Minuten</b>, bevor die Abwesenheit etwas auslöst – sonst schaltet die Heizung ab, weil ein Telefon kurz geschlafen hat."
K07 = "<b>Zufällige MAC-Adressen.</b> Aktuelle Telefone verwenden je WLAN eine eigene, zufällige MAC. Im Gerät muss für das Heimnetz die <i>private WLAN-Adresse</i> abgeschaltet sein, sonst ändert sich die Adresse und die Erkennung geht ins Leere. Alternativ die feste IP-Adresse aus der Fritz!Box eintragen."
K08 = "<b>Ohne MQTT Gateway kein MQTT.</b> Ist auf dem LoxBerry kein Gateway eingerichtet, beendet sich der MQTT-Listener sofort und die Steuerung aus Loxone bleibt stumm. Dann bleibt nur der UDP-Weg."
K09 = "Steuerung aus Loxone"
K10 = "Über virtuelle Ausgänge, <b>nicht retained</b> gesendet:"
K11 = "Alles Weitere steht im Reiter <i>Einbindung in Loxone</i>; der Reiter <i>Test</i> enthält eine Diagnose, die Zeitplan, Listener, Broker und die benötigten Werkzeuge einzeln prüft."
K12 = "Weg"
K13 = "Wann sinnvoll"
K14 = "<b>Fritz!Box fragen</b> (TR-064)"
K15 = "Schnell und lautlos – der Router weiß ohnehin, wer angemeldet ist. Setzt eine Fritz!Box mit eingeschaltetem TR-064 voraus."
K16 = "<b>Aktiv suchen</b> (arping/ping)"
K17 = "Notwendig ohne Fritz!Box. Weckt Geräte unter Umständen aus dem Ruhezustand."
K18 = "Thema"
K19 = "Wirkung"
K20 = "<span class='sm-mono'>wifi_ng/cmd/scan</span>"
K21 = "Sofort-Scan"
K22 = "<span class='sm-mono'>wifi_ng/cmd/mode</span>"
K23 = "Suchweg umstellen"
K24 = "<span class='sm-mono'>wifi_ng/cmd/interval</span>"
K25 = "Abfragetakt in Minuten"
K26 = "<span class='sm-mono'>wifi_ng/cmd/enable</span>"
K27 = "periodisches Scannen aus/ein"
